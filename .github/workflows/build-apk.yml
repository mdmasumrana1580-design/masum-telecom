name: Build Masum Telecom APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Android project
        run: unzip -q Masum-Telecom-API-Ready-Source.zip -d source

      - name: Prepare debug signing
        run: |
          keytool -genkeypair -v \
            -keystore source/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: gradle -p source :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masum-Telecom-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
